<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Host Demo</title>
  </head>
  <body>
    <main class="host-shell">
      <section class="host-panel">
        <p class="hero-kicker">Host Demo</p>
        <h1>外部系统接入示例</h1>
        <p>宿主不关心 Vue 实现，只通过 SDK Core 定义的 API 和浏览器运行时进行渲染。</p>
        <div class="host-actions">
          <button id="mount-hello" type="button">按名称渲染 hello-card</button>
          <button id="mount-stats" type="button" class="secondary">按名称渲染 stats-card</button>
        </div>
        <pre id="host-log"></pre>
      </section>

      <section class="host-layout">
        <section class="host-panel">
          <h2>SDK 渲染区</h2>
          <div id="host-card"></div>
        </section>
        <section class="host-panel">
          <h2>卡片数据</h2>
          <pre id="host-registry" class="code-block"></pre>
        </section>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
